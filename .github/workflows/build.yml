name: Build APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Create Flutter Project
        run: flutter create . --platforms=android --project-name ostra_app

      - name: Fix Android Permissions & Firebase
        run: |
          cp google-services.json android/app/
          python3 -c "
          import os
          
          # 1. Add Internet Permission
          manifest = 'android/app/src/main/AndroidManifest.xml'
          if os.path.exists(manifest):
              with open(manifest, 'r') as f: c = f.read()
              if 'android.permission.INTERNET' not in c:
                  c = c.replace('<application', '    <uses-permission android:name=\"android.permission.INTERNET\" />\n    <application')
                  with open(manifest, 'w') as f: f.write(c)
          
          # 2. Add Google Services Plugin
          for path in ['android/settings.gradle.kts', 'android/settings.gradle']:
              if os.path.exists(path):
                  with open(path, 'r') as f: c = f.read()
                  if 'com.google.gms.google-services' not in c:
                      c = c.replace('plugins {', 'plugins {\n    id(\"com.google.gms.google-services\") version \"4.4.1\" apply false')
                      with open(path, 'w') as f: f.write(c)
                      
          for path in ['android/app/build.gradle.kts', 'android/app/build.gradle']:
              if os.path.exists(path):
                  with open(path, 'r') as f: c = f.read()
                  if 'com.google.gms.google-services' not in c:
                      c = c.replace('plugins {', 'plugins {\n    id(\"com.google.gms.google-services\")')
                      with open(path, 'w') as f: f.write(c)
          "

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ostra-app
          path: build/app/outputs/flutter-apk/app-release.apk
