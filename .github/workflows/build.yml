name: Build APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Create Flutter Project
        run: flutter create . --platforms=android --project-name ostra_app

      - name: Manual Firebase Integration & Permissions
        run: |
          cp google-services.json android/app/
          
          # إضافة إذن الإنترنت (حل مشكلة عدم فتح التطبيق)
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml
          
          # إضافة إعدادات فايربيس
          if [ -f android/settings.gradle.kts ]; then
            sed -i 's/plugins {/plugins {\n    id("com.google.gms.google-services") version "4.4.1" apply false/' android/settings.gradle.kts
            sed -i 's/plugins {/plugins {\n    id("com.google.gms.google-services")/' android/app/build.gradle.kts
          elif [ -f android/settings.gradle ]; then
            sed -i 's/plugins {/plugins {\n    id("com.google.gms.google-services") version "4.4.1" apply false/' android/settings.gradle
            sed -i 's/plugins {/plugins {\n    id("com.google.gms.google-services")/' android/app/build.gradle
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ostra-app
          path: build/app/outputs/flutter-apk/app-release.apk
