name: Build APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Create Flutter Project
        run: flutter create . --platforms=android --project-name ostra_app

      - name: Setup Firebase for Android
        run: |
          cp google-services.json android/app/
          sed -i -E 's/(id\("com.android.application"\) version "[^"]+" apply false)/\1\n    id("com.google.gms.google-services") version "4.4.1" apply false/' android/settings.gradle.kts
          sed -i 's/id("com.android.application")/id("com.android.application")\n    id("com.google.gms.google-services")/' android/app/build.gradle.kts

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ostra-app
          path: build/app/outputs/flutter-apk/app-release.apk
