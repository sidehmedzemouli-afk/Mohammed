name: Build APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Create Flutter Project
        run: flutter create . --platforms=android --project-name ostra_app

      - name: Manual Firebase Integration
        run: |
          cp google-services.json android/app/
          SETTINGS_FILE=$(find android -maxdepth 1 -name "settings.gradle*" | head -n 1)
          APP_GRADLE_FILE=$(find android/app -maxdepth 1 -name "build.gradle*" | head -n 1)
          
          if [ -n "$SETTINGS_FILE" ]; then
            sed -i 's/plugins {/plugins {\n    id("com.google.gms.google-services") version "4.4.1" apply false/' "$SETTINGS_FILE"
          fi
          
          if [ -n "$APP_GRADLE_FILE" ]; then
            sed -i 's/plugins {/plugins {\n    id("com.google.gms.google-services")/' "$APP_GRADLE_FILE"
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ostra-app
          path: build/app/outputs/flutter-apk/app-release.apk
